# Verify these two against the values SonarCloud assigns when you import
# this repo — it usually picks org=<github-org-lowercase>,
# projectKey=<org>_<repo>, but confirm on the project's Administration page.
sonar.organization=eigensu
sonar.projectKey=eigensu_first-layout

sonar.sources=apps/frontend/src,apps/backend/app
sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/build/**,**/__pycache__/**,**/*.pyc

sonar.python.version=3.11

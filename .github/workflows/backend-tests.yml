name: Backend tests

# Runs the backend suite against exactly the versions in requirements.txt,
# so a test can't pass (or fail) here because of whatever happens to be
# installed on a developer's machine.

on:
  pull_request:
    paths:
      - "apps/backend/**"
      - ".github/workflows/backend-tests.yml"
  push:
    branches: [main]
    paths:
      - "apps/backend/**"
      - ".github/workflows/backend-tests.yml"

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    name: pytest (pinned requirements)
    # Not ubuntu-latest: setup-python has no 3.10.12 build for the
    # Ubuntu 26.04 image that ubuntu-latest is moving to.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v7

      # Production builds with nixpacks (apps/backend/nixpacks.toml), whose
      # `python3` comes from nixpacks' pinned nixpkgs (5148520b, unchanged
      # since nixpacks 1.x in 2023) and is CPython 3.10.12. Keep this in step
      # with what production runs.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10.12"
          cache: pip
          cache-dependency-path: apps/backend/requirements.txt

      - name: Install pinned requirements
        id: install
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Check formatting (black, isort)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: sh scripts/lint.sh
